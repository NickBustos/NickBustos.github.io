<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 80" width="400" height="80">
  <!-- Ornamento de filete: tallo con voluta en espiral, hoja de acanto y flor central.
       Técnica de capas del filete: contorno oscuro grueso + color + brillo fino. -->
  <defs>
    <g id="half">
      <!-- Hoja -->
      <path d="M258 36 C260 20 276 10 292 8 C284 16 278 28 258 36 Z"
            fill="#74ACDF" stroke="#10233f" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M262 32 C270 24 278 18 286 12" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Hoja inferior chica -->
      <path d="M236 42 C244 56 258 60 270 58 C262 52 252 46 236 42 Z"
            fill="#74ACDF" stroke="#10233f" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Tallo + voluta: tres capas -->
      <path id="stem" d="M214 40 C250 40 270 20 300 22 C330 24 346 50 326 60 C310 67 295 55 303 45 C309 38 320 43 316 50"
            fill="none" stroke="#10233f" stroke-width="8" stroke-linecap="round"/>
      <path d="M214 40 C250 40 270 20 300 22 C330 24 346 50 326 60 C310 67 295 55 303 45 C309 38 320 43 316 50"
            fill="none" stroke="#F6B40E" stroke-width="4" stroke-linecap="round"/>
      <path d="M222 38.6 C252 38 270 19 300 20.4 C322 21.6 336 36 334 46"
            fill="none" stroke="#fff6d6" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Remate de la voluta -->
      <circle cx="316" cy="50" r="3.6" fill="#F6B40E" stroke="#10233f" stroke-width="2"/>
      <!-- Puntos de remate -->
      <circle cx="352" cy="40" r="3" fill="#10233f"/>
      <circle cx="366" cy="40" r="2" fill="#10233f"/>
      <circle cx="376" cy="40" r="1.3" fill="#10233f"/>
    </g>
  </defs>

  <use xlink:href="#half" href="#half"/>
  <use xlink:href="#half" href="#half" transform="translate(400 0) scale(-1 1)"/>

  <!-- Flor central -->
  <g stroke="#10233f" stroke-width="2.2" stroke-linejoin="round">
    <path d="M200 22 L212 40 L200 58 L188 40 Z" fill="#F6B40E"/>
    <path d="M200 30 L205.5 40 L200 50 L194.5 40 Z" fill="#74ACDF"/>
  </g>
  <circle cx="200" cy="40" r="2.2" fill="#ffffff" stroke="#10233f" stroke-width="1.4"/>
</svg>
